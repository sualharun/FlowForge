# Example only; intentionally excluded from the AWS Kustomization.
# Populate through a secret manager or create an untracked private copy.
apiVersion: v1
kind: Secret
metadata:
  name: flowforge-secrets
  namespace: flowforge
type: Opaque
stringData:
  DB_PASSWORD: REPLACE_FROM_SECRET_MANAGER
  SPRING_DATA_REDIS_PASSWORD: REPLACE_ELASTICACHE_AUTH_TOKEN
  SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="REPLACE_MSK_USERNAME" password="REPLACE_MSK_PASSWORD";'
