name: Verify FlowForge
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results
          path: '**/target/surefire-reports/'
  harness:
    # The clock-validation logic decides whether a benchmark may report throughput
    # at all, so it is tested here. These cases need no running stack.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: load-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover --pattern 'test_*.py' --verbose
      - name: Check the harness scripts parse
        run: python -m compileall -q benchmark.py benchmark_timing.py chaos.py resilience.py outages.py flowforge_client.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
