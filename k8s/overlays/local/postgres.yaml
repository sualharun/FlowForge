apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: flowforge
    app.kubernetes.io/component: datastore
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: flowforge
        app.kubernetes.io/component: datastore
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - name: client
          containerPort: 5432
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
        env:
        - name: POSTGRES_DB
          value: flowforge
        - name: POSTGRES_USER
          value: flowforge
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: flowforge-secrets
              key: DB_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        startupProbe:
          exec:
            command:
            - pg_isready
            - -U
            - flowforge
            - -d
            - flowforge
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 30
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - flowforge
            - -d
            - flowforge
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - flowforge
            - -d
            - flowforge
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 6
      terminationGracePeriodSeconds: 60
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: flowforge
    app.kubernetes.io/component: datastore
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    app.kubernetes.io/name: postgres
  ports:
  - name: client
    port: 5432
    targetPort: client
