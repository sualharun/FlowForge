name: flowforge

x-app-env: &app-env
  DB_URL: jdbc:postgresql://postgres:5432/flowforge
  DB_USERNAME: flowforge
  DB_PASSWORD: ${DB_PASSWORD:-flowforge-local-only}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  REDIS_HOST: redis
  REDIS_PORT: 6379
  FLOWFORGE_WORKER_CONCURRENCY: ${FLOWFORGE_WORKER_CONCURRENCY:-4}
  FLOWFORGE_GLOBAL_CONCURRENCY: ${FLOWFORGE_GLOBAL_CONCURRENCY:-32}
  FLOWFORGE_TASK_TYPE_CONCURRENCY: ${FLOWFORGE_TASK_TYPE_CONCURRENCY:-}
  WORKER_TIMEOUT_MS: ${WORKER_TIMEOUT_MS:-15000}
  KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-12}
  KAFKA_TOPIC_REPLICAS: ${KAFKA_TOPIC_REPLICAS:-1}
  JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError}

x-app-dependencies: &app-dependencies
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  kafka:
    condition: service_healthy

x-app-health: &app-health
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 90s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowforge
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: ${DB_PASSWORD:-flowforge-local-only}
    ports: ["127.0.0.1:${DB_PORT:-5433}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U flowforge -d flowforge"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    ports: ["127.0.0.1:${REDIS_PORT:-6380}:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:${KAFKA_EXTERNAL_PORT:-29092}:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  api:
    image: flowforge/api:local
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args: {SERVICE: api-service}
    environment:
      <<: *app-env
      PORT: 8080
    depends_on: *app-dependencies
    ports: ["127.0.0.1:${API_PORT:-8088}:8080"]
    healthcheck:
      <<: *app-health
      test: [CMD-SHELL, "curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null"]
    restart: unless-stopped
    stop_grace_period: 30s

  scheduler:
    image: flowforge/scheduler:local
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args: {SERVICE: scheduler-service}
    environment:
      <<: *app-env
      PORT: 8081
    depends_on: *app-dependencies
    healthcheck:
      <<: *app-health
      test: [CMD-SHELL, "curl -fsS http://localhost:8081/actuator/health/readiness >/dev/null"]
    restart: unless-stopped
    stop_grace_period: 30s

  worker:
    image: flowforge/worker:local
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args: {SERVICE: worker-service}
    environment:
      <<: *app-env
      PORT: 8082
    depends_on: *app-dependencies
    deploy:
      replicas: 2
    healthcheck:
      <<: *app-health
      test: [CMD-SHELL, "curl -fsS http://localhost:8082/actuator/health/readiness >/dev/null"]
    restart: unless-stopped
    stop_grace_period: 30s

  frontend:
    image: flowforge/frontend:local
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports: ["127.0.0.1:${FRONTEND_PORT:-3000}:8080"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: nginx listens on IPv4 and BusyBox wget would
      # otherwise resolve localhost to ::1 first and report a refused connection.
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [observability]
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus]
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  prometheus-data:
